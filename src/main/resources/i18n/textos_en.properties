# --- guia ---
guia.titulo=NAVAL BATTLE GUIDE
guia.objetivo.t=Game Objective
guia.objetivo.1=Sink every ship in the enemy fleet before your opponent destroys yours.
guia.prep.t=Setup
guia.prep.1=Fleet placement|Ships sit on the grid horizontally or vertically. They cannot cross, overlap or leave the board.
guia.prep.2=Hidden board|Your ships' positions stay secret from the rival for the whole game.
guia.comb.t=Combat
guia.comb.1=Turn-based attack|Pick a cell on the enemy board to fire a shot.
guia.comb.2=Water|If the shot lands on an empty cell, your turn ends and the rival plays.
guia.comb.3=Hit|If the shot strikes part of an enemy ship, the cell is marked and you keep your turn to fire again.
guia.comb.4=Sunk|When every cell of a ship has been hit, the ship is completely destroyed.
guia.vic.t=Victory Condition
guia.vic.1=The first player to find and sink all the ships of the enemy fleet wins.

