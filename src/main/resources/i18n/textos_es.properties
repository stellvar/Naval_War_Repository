# --- guia ---
guia.titulo=GUÍA DE BATALLA NAVAL
guia.objetivo.t=Objetivo del Juego
guia.objetivo.1=Hundir todos los barcos de la flota enemiga antes de que el oponente destruya los tuyos.
guia.prep.t=Preparación
guia.prep.1=Ubicación de la flota|Coloca tus barcos en la cuadrícula de manera horizontal o vertical. No pueden cruzarse, solaparse ni salir de los límites del tablero.
guia.prep.2=Tablero oculto|La posición de tus naves se mantiene en secreto para el rival durante toda la partida.
guia.comb.t=Desarrollo del Combate
guia.comb.1=Ataque por turnos|Selecciona una casilla del tablero enemigo para lanzar un disparo.
guia.comb.2=Agua|Si el disparo cae en una casilla vacía, el turno finaliza y le toca al rival.
guia.comb.3=Tocado|Si el disparo impacta una sección de un barco enemigo, la casilla se marcará y conservarás el turno para realizar otro disparo.
guia.comb.4=Hundido|Al impactar todas las casillas que forman una misma nave, el barco quedará completamente destruido.
guia.vic.t=Condición de Victoria
guia.vic.1=Gana la partida el primer jugador que logre localizar y hundir la totalidad de los barcos de la flota enemiga.

